spring:
  application:
    name: Flowloom Engine

  # Database
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowloom}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

    # Hikari
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 20000

  # Flywaydb
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # i18n
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

# Mybatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.mewrix.flowloom.engine.common.persistence
  configuration:
    map-underscore-to-camel-case: true

# 会话：有效期与滑动续期最小间隔（业务时间统一为 Asia/Shanghai）
flowloom:
  session:
    timeout: 2h
    min-refresh-interval: 30m
