spring:
  application:
    name: Flowloom Engine

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/flowloom
    username: flowloom
    password: flowloom

    # Hikari
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 20000

  # Flywaydb
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # i18n
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

# Mybatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
